<!doctype html>
<html lang="en" data-root="../">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TAsF – Travel and Surf · Trip planner</title>
  <meta name="description" content="TAsF – Travel and Surf. AI-assisted surf trip planner (prototype)." />
  <link rel="icon" type="image/png" href="../assets/tasf-logo.png" />
  <link rel="stylesheet" href="../vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../index.html" aria-label="TAsF – Travel and Surf · Home">
      <img class="brand-logo" src="../assets/tasf-logo.png" alt="TAsF" />
      <span class="brand-sub" data-i18n="brandSub">Travel and Surf</span>
    </a>
    <div class="topbar-right">
      <a class="home-link" href="../index.html" data-i18n="homeLink">← Home</a>
      <span class="proto-badge" data-i18n="protoBadge">Prototype</span>
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="en" class="active">EN</button>
        <button data-lang="es">ES</button>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="map-wrap" aria-label="World surf map">
      <div class="map-hint" id="mapHint" data-i18n="mapHint">Scroll / pinch to zoom · drag to pan · hover a spot for details</div>
      <div id="map" role="region" aria-label="World map of surf destinations"></div>
      <div class="map-note" id="mapNote" data-i18n="mapOffline" hidden>Map tiles unavailable (offline): showing a simple world outline</div>
      <div class="map-controls">
        <button id="zoomIn" aria-label="Zoom in">+</button>
        <button id="zoomOut" aria-label="Zoom out">−</button>
        <button id="zoomReset" aria-label="Reset zoom">⟲</button>
      </div>
      <div class="legend" id="legend">
        <button class="legend-toggle" id="legendToggle" aria-expanded="true" aria-controls="legendBody"><span class="lt-dots" aria-hidden="true"><i class="sw r3"></i><i class="sw r2"></i><i class="sw r1"></i><i class="sw r0"></i></span><span class="lt-label" data-i18n="legendBtn">Legend</span></button>
        <div class="legend-body" id="legendBody">
        <div class="legend-title" data-i18n="legendTitle">Season for your trip</div>
        <div class="legend-row"><span class="sw r3"></span><span data-i18n="r3">Peak season</span></div>
        <div class="legend-row"><span class="sw r2"></span><span data-i18n="r2">Shoulder season</span></div>
        <div class="legend-row"><span class="sw r1"></span><span data-i18n="r1">Surfable</span></div>
        <div class="legend-row"><span class="sw r0"></span><span data-i18n="r0">Not surfable / no fit</span></div>
        <div class="legend-row small" id="legendWaves" hidden><span class="sw ring"></span><span data-i18n="legendWave">Has a wave you picked</span></div>
        </div>
      </div>
      <div class="tooltip" id="tooltip" hidden></div>
      <div class="dest-card" id="destCard" hidden></div>
    </section>

    <aside class="panel" aria-label="Trip planner">
      <nav class="stepper" id="stepper" aria-label="Steps"></nav>
      <div class="step-body" id="stepBody"></div>
      <div class="step-nav">
        <button class="btn ghost" id="backBtn" data-i18n="back">Back</button>
        <div class="match-count" id="matchCount"></div>
        <button class="btn primary" id="nextBtn" data-i18n="next">Next</button>
      </div>
    </aside>
  </main>

  <div class="modal" id="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" aria-label="Close">×</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <!-- Vendored locally so the prototype works offline -->
  <!-- Leaflet 1.9.4 (BSD-2-Clause, vendor/leaflet/LICENSE.txt). Base map tiles are loaded from CARTO on demand;
       offline, the vector outline in land-50m.js is shown instead. -->
  <script src="../vendor/leaflet/leaflet.js"></script>
  <script src="../vendor/topojson-client.min.js"></script>
  <script src="../vendor/land-50m.js"></script>
  <script src="../data.js"></script>
  <script src="../i18n.js"></script>
  <script src="../planner.js"></script>
  <script src="../travel.js"></script>
  <!-- Surf forecast: generated daily by scripts/update_forecast.py (works from file:// too). Missing file = "forecast unavailable". -->
  <script src="../forecast.js"></script>
  <script src="../surf-forecast-links.js"></script>
  <script src="../app.js"></script>
</body>
</html>
